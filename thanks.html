  <script>
    (function () {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) {
        document.querySelectorAll('.welcome-dance animateTransform').forEach(function (el) { el.remove(); });
        return;
      }

      var field = document.getElementById('fireworkField');
      if (!field) return;

      function burst(cxPct, cyPx, delay) {
        var sparkCount = 22;
        for (var i = 0; i < sparkCount; i++) {
          var angle = (i / sparkCount) * Math.PI * 2 + Math.random() * 0.25;
          var dist = 70 + Math.random() * 90;
          var dx = Math.cos(angle) * dist;
          var dy = Math.sin(angle) * dist;
          var el = document.createElement('div');
          el.className = 'firework-spark';
          el.style.left = cxPct + '%';
          el.style.top = cyPx + 'px';
          el.style.setProperty('--dx', dx.toFixed(0) + 'px');
          el.style.setProperty('--dy', dy.toFixed(0) + 'px');
          el.style.animationDelay = delay + 's';
          field.appendChild(el);
        }
      }

      burst(28, 120, 0.05);
      burst(72, 90, 0.35);
      burst(50, 150, 0.65);
    })();
