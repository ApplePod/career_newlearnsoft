<!DOCTYPE html>

<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo"><span class="nav-logo-mark">N</span>뉴런소프트</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">홈</a>
      <a href="positions/index.html" class="nav-link">채용 포지션</a>
    </div>
  </nav>

  <div class="firework-field" aria-hidden="true" id="fireworkField"></div>

  <div class="hero thanks-hero">
    <div class="hero-badge">지원 완료</div>

    <div class="welcome-team" aria-hidden="true">
      <svg class="welcome-team-link" viewBox="0 0 400 50" preserveAspectRatio="none">
        <path d="M24 26 Q200 -6 376 26" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="4 6" />
      </svg>
      <div class="welcome-avatar" style="--i:0">
        <div class="welcome-avatar-shadow"></div>
        <img src="assets/team/dochi.png" alt="" />
        <span class="welcome-avatar-name">도치</span>
      </div>
      <div class="welcome-avatar" style="--i:1">
        <div class="welcome-avatar-shadow"></div>
        <img src="assets/team/malti.png" alt="" />
        <span class="welcome-avatar-name">말티</span>
      </div>
      <div class="welcome-avatar welcome-avatar--center" style="--i:2">
        <div class="welcome-avatar-shadow"></div>
        <img src="assets/team/soho.png" alt="" />
        <span class="welcome-avatar-name">소호</span>
      </div>
      <div class="welcome-avatar" style="--i:3">
        <div class="welcome-avatar-shadow"></div>
        <img src="assets/team/jay.png" alt="" />
        <span class="welcome-avatar-name">제이</span>
      </div>
      <div class="welcome-avatar" style="--i:4">
        <div class="welcome-avatar-shadow"></div>
        <img src="assets/team/noah.png" alt="" />
        <span class="welcome-avatar-name">노아</span>
      </div>
    </div>
    <p class="welcome-caption">뉴런팀 다섯 명이 함께 환영합니다</p>

    <h1 class="hero-title thanks-title">지원해주셔서<br />감사합니다</h1>
    <p class="hero-desc">보내주신 이력서·포트폴리오는 담당자가 확인 후,<br class="thanks-desc-break" />기재해주신 이메일로 다음 절차를 안내드립니다.</p>
    <div class="hero-cta">
      <a href="index.html" class="btn-primary">홈으로 돌아가기</a>
      <a href="positions/index.html" class="btn-secondary">다른 포지션 보기</a>
    </div>
  </div>

  <footer class="footer thanks-footer">
    <div class="footer-logo">뉴런소프트</div>
    <div class="footer-meta">주식회사 뉴런소프트 · 서울특별시 관악구 봉천로 545, 서울창업센터 관악</div>
    <div class="footer-links">
      <a href="index.html">홈</a>
      <a href="positions/index.html">채용 포지션</a>
    </div>
  </footer>

  <script>
    (function () {
      var field = document.getElementById('fireworkField');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !field) return;

      function burst(cxPct, cyPx, delay) {
        var sparkCount = 22;
        for (var i = 0; i < sparkCount; i++) {
          var angle = (i / sparkCount) * Math.PI * 2 + Math.random() * 0.25;
          var dist = 70 + Math.random() * 90;
          var dx = Math.cos(angle) * dist;
          var dy = Math.sin(angle) * dist;
          var el = document.createElement('div');
          el.className = 'firework-spark';
          el.style.left = cxPct + '%';
          el.style.top = cyPx + 'px';
          el.style.setProperty('--dx', dx.toFixed(0) + 'px');
          el.style.setProperty('--dy', dy.toFixed(0) + 'px');
          el.style.animationDelay = delay + 's';
          field.appendChild(el);
        }
      }

      burst(28, 120, 0.05);
      burst(72, 90, 0.35);
      burst(50, 150, 0.65);
    })();
  </script>

</body>
</html>
