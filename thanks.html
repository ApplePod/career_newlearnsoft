<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지원해주셔서 감사합니다 | 뉴런소프트 채용</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo"><span class="nav-logo-mark">N</span>뉴런소프트</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">홈</a>
      <a href="positions/index.html" class="nav-link">채용 포지션</a>
    </div>
  </nav>

  <div class="confetti-field" aria-hidden="true" id="confettiField"></div>

  <div class="hero thanks-hero">
    <div class="thanks-icon" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none" stroke="#000000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21 L16 29 L32 11" /></svg>
    </div>
    <div class="hero-badge">지원 완료</div>
    <h1 class="hero-title thanks-title">지원해주셔서<br />감사합니다</h1>
    <p class="hero-desc">보내주신 이력서·포트폴리오는 담당자가 확인 후,<br class="thanks-desc-break" />기재해주신 이메일로 다음 절차를 안내드립니다.</p>
    <div class="hero-cta">
      <a href="index.html" class="btn-primary">홈으로 돌아가기</a>
      <a href="positions/index.html" class="btn-secondary">다른 포지션 보기</a>
    </div>
  </div>

  <footer class="footer thanks-footer">
    <div class="footer-logo">뉴런소프트</div>
    <div class="footer-meta">주식회사 뉴런소프트 · 서울특별시 관악구 봉천로 545, 서울창업센터 관악</div>
    <div class="footer-links">
      <a href="index.html">홈</a>
      <a href="positions/index.html">채용 포지션</a>
    </div>
  </footer>

  <script>
    (function () {
      var field = document.getElementById('confettiField');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !field) return;
      var COUNT = 70;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < COUNT; i++) {
        var el = document.createElement('div');
        el.className = 'confetti-star';
        var size = (Math.random() * 4.5 + 1.5);
        var left = (Math.random() * 100);
        var dur = (7 + Math.random() * 10);
        var delay = -(Math.random() * dur);
        var drift = (Math.random() * 80 - 40);
        var op = (0.35 + Math.random() * 0.55);
        el.style.left = left.toFixed(2) + '%';
        el.style.width = size.toFixed(1) + 'px';
        el.style.height = size.toFixed(1) + 'px';
        el.style.setProperty('--drift', drift.toFixed(0) + 'px');
        el.style.animationDuration = dur.toFixed(1) + 's';
        el.style.animationDelay = delay.toFixed(1) + 's';
        el.style.opacity = op.toFixed(2);
        el.style.boxShadow = '0 0 ' + (size * 2.2).toFixed(1) + 'px rgba(255,255,255,0.85)';
        frag.appendChild(el);
      }
      field.appendChild(frag);
    })();
  </script>

</body>
</html>
